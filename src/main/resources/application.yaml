spring:
  application:
    name: knowlink

  datasource:
    url: jdbc:mysql://${RAILWAY_TCP_PROXY_DOMAIN}:${RAILWAY_TCP_PROXY_PORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: true
    open-in-view: false

  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  profiles:
    active: ${SPRING_PROFILE:development}

  data:
    web:
      pageable:
        one-indexed-parameters: false
      rest:
        page-parameter-name: page
        size-parameter-name: size
        sort-parameter-name: sort
  
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_EXPIRATION:86400000}

confirmation-token:
  encryption-key: ${ENCRYPTION_KEY:}

frontend:
  url: ${FRONTEND_URL}

app:
  url: ${APP_URL}

brevo:
  api-key: ${BREVO_API_KEY}
  sender-address: ${BREVO_SENDER_ADDRESS}
  sender-name: ${BREVO_SENDER_NAME:KnowLink}

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    com.knowlink.api: INFO
